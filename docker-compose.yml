version: '3.8'

services:
  backend:
    build: .
    container_name: commercial_license_api
    environment:
      # Oracle Database Configuration
      DB_USER: ${DB_USER:-AI_READ}
      DB_PASSWORD: ${DB_PASSWORD:-Ai2025aI}
      DATABASE_URL: ${DATABASE_URL}
      
      # Azure OpenAI Configuration
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${AZURE_OPENAI_DEPLOYMENT_NAME}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME}
      
      # Application Configuration
      LLM_MODEL: ${LLM_MODEL:-gpt-3.5-turbo}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
    ports:
      - "8000:8000"
    networks:
      - commercial_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Oracle SQL Developer Web (if you want a web interface for Oracle)
  # Uncomment if you need a web-based Oracle client
  # oracle-web:
  #   image: oracle/sqldev-web:latest
  #   container_name: oracle_web_client
  #   ports:
  #     - "8080:8080"
  #   networks:
  #     - commercial_network
  #   restart: unless-stopped

networks:
  commercial_network:
    driver: bridge 